name: Web y extensiones

on:
  push:
    branches: [main, "main-*"]
    paths: ["Web/**", "BrowserExtension/**", "Sources/**", "package.json", ".github/workflows/web.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas unitarias, de seguridad y de paridad con Swift
        run: npm test
      - name: Pruebas de extremo a extremo (iPhone emulado, API simulada)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          npm run test:e2e

  # Publica Web/ (sin las pruebas) en la rama gh-pages al fusionar en main.
  # Pages se sirve desde esa rama: Settings → Pages → Deploy from a branch → gh-pages, / (root).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web (sin las pruebas)
        run: |
          rsync -a --exclude tests Web/ _site/
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Publicar web desde ${{ github.sha }}"
